name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Install CLI
        run: ./gradlew installDist

      # Rebuilds every example, compiles the C, runs the binary, and diffs both
      # generated.user.c and the program's stdout against what is committed.
      - name: Verify example C snapshots and output
        run: ./examples/regenerate.sh --check

      - name: Verify foreign-edge example
        run: ./examples/ffi-mini/run.sh
