# Magic binding manifest for kira:tuples (C++ and py backends; a Tuple is a Python tuple).
#
# Every entry is a `cpp` map without a `symbol` key, so the C loader skips it.
# TupleN<...> is the aggregate kira::TupleN with fields first, second, ...;
# `size()` is the arity, a constant.
T0.size: { cpp: { expr: "static_cast<std::int32_t>(0)", pure: true, constexpr: true }, py: { expr: "0" } }
T1.size: { cpp: { expr: "static_cast<std::int32_t>(1)", pure: true, constexpr: true }, py: { expr: "1" } }
T2.size: { cpp: { expr: "static_cast<std::int32_t>(2)", pure: true, constexpr: true }, py: { expr: "2" } }
T3.size: { cpp: { expr: "static_cast<std::int32_t>(3)", pure: true, constexpr: true }, py: { expr: "3" } }
T4.size: { cpp: { expr: "static_cast<std::int32_t>(4)", pure: true, constexpr: true }, py: { expr: "4" } }
T5.size: { cpp: { expr: "static_cast<std::int32_t>(5)", pure: true, constexpr: true }, py: { expr: "5" } }
T6.size: { cpp: { expr: "static_cast<std::int32_t>(6)", pure: true, constexpr: true }, py: { expr: "6" } }
