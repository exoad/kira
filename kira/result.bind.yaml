# Magic binding manifest for kira:result (C++ and py backends).
#
# A `py` map beside `cpp` is the py target's binding (PyBindingTable): `expr` with the same
# placeholders, each used once and the receiver first, so Python's left-to-right evaluation is
# Kira's; a `_k_` name in it is a helper of kira/py/runtime.py.
#
# Every entry is a `cpp` map without a `symbol` key, so the C loader skips it.
# Maybe<T> is std::optional<T> for a value and a nullable kira::Rc<C> for a
# class (D32); the kira::isSome / unwrap / unwrapOr free functions overload on
# both, which is why the bindings never touch the optional API directly.
# Result<T, E> is kira::Result, Weak<C> is kira::Weak (std::weak_ptr).
#
# `constexpr` on the Maybe entries describes the std::optional overloads,
# the receiver that is a literal type. The kira::Rc overloads for Maybe<C>
# are not constexpr (design section 6), and a @_const body holding a class
# reference fails ConstEligibilityPass's literal-type rule before any flag is
# read. The flags' meaning is defined in core.bind.yaml.
Maybe.isSome:   { cpp: { expr: "kira::isSome({self})", pure: true, constexpr: true }, py: { expr: "({self} is not None)" } }
Maybe.isNone:   { cpp: { expr: "(!kira::isSome({self}))", pure: true, constexpr: true }, py: { expr: "({self} is None)" } }
Maybe.isNull:   { cpp: { expr: "(!kira::isSome({self}))", pure: true, constexpr: true }, py: { expr: "({self} is None)" } }
Maybe.unwrap:   { cpp: { expr: "kira::unwrap({self})", pure: true, constexpr: true }, py: { expr: "_k_value({self})" } }
Maybe.unwrapOr: { cpp: { expr: "kira::unwrapOr({self}, {0})", pure: true, constexpr: true }, py: { expr: "_k_or({self}, {0})" } }

Result.isOk:      { cpp: { expr: "{self}.isOk()", pure: true }, py: { expr: "{self}[0]" } }
Result.isErr:     { cpp: { expr: "{self}.isErr()", pure: true }, py: { expr: "(not {self}[0])" } }
Result.unwrap:    { cpp: { expr: "{self}.unwrap()", pure: true }, py: { expr: "_k_unwrap({self})" } }
Result.unwrapErr: { cpp: { expr: "{self}.unwrapErr()", pure: true }, py: { expr: "_k_unwrap_err({self})" } }

Weak.upgrade:     { cpp: { expr: "{self}.lock()", pure: true } }
