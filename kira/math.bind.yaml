# Magic binding manifest for kira:math (C, C++ and py backends).
#
# A `py` map beside `cpp` is the py target's binding (PyBindingTable): `expr` with the same
# placeholders, each used once and the receiver first, so Python's left-to-right evaluation is
# Kira's; a `_k_` name in it is a helper of kira/py/runtime.py.
#
# Each @_magic declaration in kira/math.kira is typechecked from its Kira
# signature; the C symbol it lowers to and the include it needs live here,
# beside the declaration, instead of inside the compiler. The C backend loads
# every *.bind.yaml next to the stdlib modules and resolves magic names
# through the table (see CMagicBindingTable).
#
# A binding is either a bare symbol (`sqrt: sqrt`) or a map with `symbol` and
# optional `includes`. The key is the canonical Kira name, lowercased with
# leading `@` and surrounding `_` stripped (same canonicalization the codegen
# applies to intrinsic spellings like `@_trace_`).
#
# The `cpp` sub-map is the C++ backend's binding (design section 7.4); the C
# loader reads only `symbol` and `includes`, so it never sees it. `min` and
# `max` are parenthesized against the Windows `min` / `max` macros. The
# functions are `<T: FloatNum>` with @_infer (D20), and each cpp expr serves
# both instantiations: std::sqrt, std::fabs and the rest overload float and
# double, and std::min/std::max deduce T from two arguments of one type, which
# the typer guarantees. The C symbols and includes are unchanged.
sqrt: { symbol: sqrt, includes: [math.h], cpp: { expr: "std::sqrt({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_sqrt({0})" } }
pow: { symbol: pow, includes: [math.h], cpp: { expr: "std::pow({0}, {1})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_pow({0}, {1})" } }
floor: { symbol: floor, includes: [math.h], cpp: { expr: "std::floor({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_floor({0})" } }
ceil: { symbol: ceil, includes: [math.h], cpp: { expr: "std::ceil({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_ceil({0})" } }
round: { symbol: round, includes: [math.h], cpp: { expr: "std::round({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_round({0})" } }
sin: { symbol: sin, includes: [math.h], cpp: { expr: "std::sin({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_sin({0})" } }
cos: { symbol: cos, includes: [math.h], cpp: { expr: "std::cos({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_cos({0})" } }
tan: { symbol: tan, includes: [math.h], cpp: { expr: "std::tan({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_tan({0})" } }
abs: { symbol: fabs, includes: [math.h], cpp: { expr: "std::fabs({0})", includes: ["<cmath>"], pure: true }, py: { expr: "_k_math.fabs({0})" } }
min: { symbol: fmin, includes: [math.h], cpp: { expr: "(std::min)({0}, {1})", includes: ["<algorithm>"], pure: true }, py: { expr: "_k_min({0}, {1})" } }
max: { symbol: fmax, includes: [math.h], cpp: { expr: "(std::max)({0}, {1})", includes: ["<algorithm>"], pure: true }, py: { expr: "_k_max({0}, {1})" } }
