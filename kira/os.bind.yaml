removeTree:       { cpp: { unsupported: "py only for now: shutil.rmtree has no C++ half yet" }, py: { expr: "_k_osdo(_k_shutil.rmtree, {0})" } }
setModifiedS:     { cpp: { unsupported: "py only for now: os.utime has no C++ half yet" }, py: { expr: "_k_osdo(_k_touch, {0}, {1})" } }
