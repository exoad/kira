# Magic binding manifest for kira:os (C++ backend only).
#
# Every entry is a `cpp` map without a `symbol` key, so the C loader skips
# it (the C backend has no sockets). Keys are `Type.method` and the bare
# name of each free function; placeholders and flags as in core.bind.yaml.
# Every class here is a Kira class, so `{self}` is a kira::Rc<C> (design
# 5.1) and the member is reached with `->`. Nothing is pure: every call
# reaches the operating system, or reads a per-thread error it may have set.
#
# The module's two structs (Datagram, Ready) and its constants (POLL_*,
# SIGNAL_*) are not bindings: kira/cpp/kira/os.hxx defines them by hand as
# kira::os::Datagram, kira::os::Ready and inline constexpr constants, the
# aggregate and constant forms of design 5.2, under the kira::os namespace
# that the kira:os URI maps to (D14).
#
# Runtime names, declared in kira/cpp/kira/os.hxx and defined in os.cxx,
# namespace kira::os: lastError; UdpSocket (bind, localPort, sendTo,
# recvFrom, handle, close); TcpListener (listen, localPort, accept, handle,
# close); TcpStream (connect, read, write, isOpen, handle, close); Poller
# (add, remove, wait); Serial (open, read, write, isOpen, handle, close);
# readFile, readText, writeFileAtomic, listDir, exists, makeDirs, freeBytes;
# Process (readStdout, kill, wait, isRunning, stdoutHandle), spawnProcess;
# onSignal, env, exit.

lastError: { cpp: { expr: "kira::os::lastError()", includes: ["kira/os.hxx"] } }

# --- UdpSocket -------------------------------------------------------------
UdpSocket.bind:      { cpp: { expr: "{self}->bind({0}, {1})", includes: ["kira/os.hxx"] } }
UdpSocket.localPort: { cpp: { expr: "{self}->localPort()", includes: ["kira/os.hxx"] } }
UdpSocket.sendTo:    { cpp: { expr: "{self}->sendTo({0}, {1}, {2})", includes: ["kira/os.hxx"] } }
UdpSocket.recvFrom:  { cpp: { expr: "{self}->recvFrom({0})", includes: ["kira/os.hxx"] } }
UdpSocket.handle:    { cpp: { expr: "{self}->handle()", includes: ["kira/os.hxx"] } }
UdpSocket.close:     { cpp: { expr: "{self}->close()", includes: ["kira/os.hxx"] } }

