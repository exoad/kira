# Magic binding manifest for kira:os (C++ and py backends).
#
# Every entry is a `cpp` map without a `symbol` key, so the C loader skips
# it (the C backend has no sockets). Keys are `Type.method` and the bare
# name of each free function; placeholders and flags as in core.bind.yaml.
# Every class here is a Kira class, so `{self}` is a kira::Rc<C> (design
# 5.1) and the member is reached with `->`. Nothing is pure: every call
# reaches the operating system, or reads a per-thread error it may have set.
#
# The module's structs (Datagram, Ready, Ran) and its constants (POLL_*,
# SIGNAL_*) are not bindings: kira/cpp/kira/os.hxx defines them by hand as
# kira::os::Datagram, kira::os::Ready and inline constexpr constants, the
# aggregate and constant forms of design 5.2, under the kira::os namespace
# that the kira:os URI maps to (D14).
#
# Runtime names, declared in kira/cpp/kira/os.hxx and defined in os.cxx,
# namespace kira::os: lastError, lastErrorKind; UdpSocket (bind, localPort, sendTo,
# recvFrom, handle, close); TcpListener (listen, localPort, accept, handle,
# close); TcpStream (connect, read, write, isOpen, handle, close); Poller
# (add, remove, wait); Serial (open, read, write, isOpen, handle, close);
# readFile, readText, readTextLf, readFileHead, writeFile, writeFileAtomic, listDir,
# exists, isFile, isDir, fileSize, modifiedS, removeFile, replaceFile, makeDirs,
# freeBytes; FileOut (write, sync, size, isStale, close), openAppend, openWrite;
# Process (readStdout, kill, wait, isRunning, stdoutHandle, pid), spawnProcess;
# setAffinity, nice; onSignal, env, exit. args (D71) is kira::rt::args in
# kira/main.hxx, from the argv runMain keeps.
#
# On py each is a _k_ helper or runtime class of kira/py/runtime.py (K3, K4). The py-only entries
# below say cpp: { unsupported }, refused at compile time with the reason (D83).

lastError:     { cpp: { expr: "kira::os::lastError()", includes: ["kira/os.hxx"] }, py: { expr: "_k_oserror()" } }
lastErrorKind: { cpp: { expr: "kira::os::lastErrorKind()", includes: ["kira/os.hxx"] }, py: { expr: "_k_oserrkind()" } }

# --- UdpSocket -------------------------------------------------------------
UdpSocket.bind:      { cpp: { expr: "{self}->bind({0}, {1})", includes: ["kira/os.hxx"] }, py: { expr: "{self}.bind({0}, {1})" } }
UdpSocket.localPort: { cpp: { expr: "{self}->localPort()", includes: ["kira/os.hxx"] }, py: { expr: "{self}.localPort()" } }
UdpSocket.sendTo:    { cpp: { expr: "{self}->sendTo({0}, {1}, {2})", includes: ["kira/os.hxx"] }, py: { expr: "{self}.sendTo({0}, {1}, {2})" } }
UdpSocket.recvFrom:  { cpp: { expr: "{self}->recvFrom({0})", includes: ["kira/os.hxx"] }, py: { expr: "{self}.recvFrom({0})" } }
UdpSocket.handle:    { cpp: { expr: "{self}->handle()", includes: ["kira/os.hxx"] }, py: { expr: "{self}.handle()" } }
UdpSocket.close:     { cpp: { expr: "{self}->close()", includes: ["kira/os.hxx"] }, py: { expr: "{self}.close()" } }

