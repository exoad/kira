# Magic binding manifest for kira:core (C++ and py backends).
#
# Every entry here is a map with a `cpp` sub-map and no `symbol` key, so the
# C loader (CMagicBindingTable) skips all of them: the C backend keeps
# lowering Str and Num methods through its own Str_* / prelude helpers. The
# C++ backend reads the `cpp` map -- see design section 7.4. A `py` map beside
# it is the py target's binding, as collections.bind.yaml describes.
#
# Keys: methods as `Type.method`, free functions by name. A method a magic
# class takes from a trait without a body (Str.equals from Equatable<Str>) is
# keyed on the class, because the call is magic there. A scalar reaches Num's
# entries through its parent: Int32.abs is Num.abs, and the emitter walks the
# parent chain when the receiver's own class has no entry.
#
# Placeholders in `expr`: `{self}` the receiver; `{0}`, `{1}`, ... the
# arguments in order; `{T0}`, `{T1}`, ... the type arguments of the bound
# declaration as the typer instantiated them at the call. For a generic free
# function they are its own type parameters (`bitCast<Float32>(u)` gives
# `{T0}` = float); for a method of a generic class they are the class's type
# parameters, read from the receiver's type (`mv.view()` on a MutView<UInt8>
# gives `{T0}` = std::uint8_t). A generic method of a generic class would
# number the class's parameters first, then its own; no stdlib entry needs
# that.
#
# `pure`: the call has no side effects, and its result depends only on the
# values of its receiver and arguments at the moment it runs. It may read its
# receiver (List.size, Map.get, Str.length, Weak.upgrade all do); that read
# is what a plain variable read is to D33, which spills call arguments only
# when two or more operands hold impure calls. So `f(xs.size(), xs.grow())`
# is not spilled by this flag alone, exactly as `f(n, g())` is not when g()
# writes n; whether ExclusivityPass or a receiver-overlap rule covers that
# pair is W2.5's, not the flag's. A pure call may still panic (a checked
# index, unwrap on none: D10); the flag never licenses dropping or reordering
# it.
# `constexpr`: the target is declared constexpr, so the call is usable in a
# constant expression whenever the receiver and arguments are literal types;
# whether they are is ConstEligibilityPass's literal-type rule, not this flag.
#
# Runtime names this manifest uses beyond design section 6. kira/cpp/kira/rt.hxx
# defines the kira::str ones, and kira/cpp/kira/core.hxx defines kira::abs and
# the scalar kira::hashCode (both profiles; kira/cpp/tests/rt_test.cxx checks
# each rule below):
#   kira::str::equals(const Str&, const Str&) -> bool   (content equality; a
#     free function so a `const char*` Str constant converts on either side,
#     where `LIDAR_IP == "..."` would compare pointers and fail -Werror=address)
#   kira::str::find(const Str&, const Str&) -> std::optional<Size>
#   kira::str::hashCode(const Str&) -> std::int64_t   (djb2 as Str_hashCode in
#     kira/c/c_generator.c: h = h * 33 + byte over uint64, cast to int64)
#   kira::str::bytes(const Str&) -> List<std::uint8_t>   (Str.bytes, D54: hosted)
#   template<class T> constexpr T abs(T) noexcept      (type-preserving; unsigned
#     is the identity, INT_MIN stays INT_MIN by wrapping, D8; a floating-point
#     T clears the sign bit, so abs(-0.0) is +0.0 as fabs and Math.abs give,
#     which the C and JS backends print as 0, never -0)
#   template<class T> constexpr std::int64_t hashCode(T) noexcept   (integers by
#     value, floats by the bits of the double, bool 0/1, Char by ord)
#
# On the py target a Str is a Python str, so a length or an index counts CODE POINTS where C++
# counts the bytes of its UTF-8: the same numbers for ASCII text, and the one py rule for text.
# Every other rule is kira::str's: substring panics out of range (_k_substr) where a slice
# stops short, an index past the end is Python's IndexError (Kira's index panic), find is none
# rather than -1, split keeps empty pieces and gives the text back whole for an empty delimiter
# (Python raises), trim takes space, tab, CR and LF only, the case changes touch A-Z and a-z
# only, toInt64 and toFloat64 are the strict parsers (_k_toint, _k_tofloat), and hashCode is
# djb2 over the UTF-8, C++'s number for any text. A Char is its code point, an int: `at` and
# s[i] are ord() of the character, padStart is rjust (it never cuts, as kira::str's), and a
# Char's text is chr() of it. A View<Char> (Str.view) has no py binding: text is a Str there.
# bytes (D54) is the text's UTF-8 on both targets (_k_utf8, a bytearray), so its size is the
# C++ target's length() for any text.
Str.equals:    { cpp: { expr: "kira::str::equals({self}, {0})", pure: true }, py: { expr: "({self} == {0})" } }
Str.hashCode:  { cpp: { expr: "kira::str::hashCode({self})", pure: true }, py: { expr: "_k_strhash({self})" } }
Str.length:    { cpp: { expr: "kira::str::length({self})", pure: true }, py: { expr: "len({self})" } }
Str.size:      { cpp: { expr: "kira::str::length({self})", pure: true }, py: { expr: "len({self})" } }
Str.isEmpty:   { cpp: { expr: "kira::str::isEmpty({self})", pure: true }, py: { expr: "(len({self}) == 0)" } }
Str.substring: { cpp: { expr: "kira::str::substring({self}, {0}, {1})", pure: true }, py: { expr: "_k_substr({self}, {0}, {1})" } }
Str.charAt:    { cpp: { expr: "kira::text(kira::str::at({self}, {0}))", pure: true }, py: { expr: "{self}[{0}]" } }
Str.at:        { cpp: { expr: "kira::str::at({self}, {0})", pure: true }, py: { expr: "ord({self}[{0}])" } }
Str.contains:  { cpp: { expr: "kira::str::contains({self}, {0})", pure: true }, py: { expr: "{self}.__contains__({0})" } }
Str.startsWith: { cpp: { expr: "kira::str::startsWith({self}, {0})", pure: true }, py: { expr: "{self}.startswith({0})" } }
Str.endsWith:  { cpp: { expr: "kira::str::endsWith({self}, {0})", pure: true }, py: { expr: "{self}.endswith({0})" } }
Str.find:      { cpp: { expr: "kira::str::find({self}, {0})", pure: true }, py: { expr: "_k_find({self}, {0})" } }
Str.split:     { cpp: { expr: "kira::str::split({self}, {0})", pure: true }, py: { expr: "_k_split({self}, {0})" } }
Str.trim:      { cpp: { expr: "kira::str::trim({self})", pure: true }, py: { expr: '{self}.strip(" \t\n\r")' } }
Str.toLower:   { cpp: { expr: "kira::str::toLower({self})", pure: true }, py: { expr: "{self}.translate(_k_lower)" } }
Str.toUpper:   { cpp: { expr: "kira::str::toUpper({self})", pure: true }, py: { expr: "{self}.translate(_k_upper)" } }
Str.toInt64:   { cpp: { expr: "kira::str::toInt64({self})", pure: true }, py: { expr: "_k_toint({self})" } }
Str.toFloat64: { cpp: { expr: "kira::str::toFloat64({self})", pure: true }, py: { expr: "_k_tofloat({self})" } }
Str.padStart:  { cpp: { expr: "kira::str::padStart({self}, {0}, {1})", pure: true }, py: { expr: "{self}.rjust({0}, chr({1}))" } }
Str.view:      { cpp: { expr: "kira::str::view({self})", pure: true } }
Str.bytes:     { cpp: { expr: "kira::str::bytes({self})", pure: true }, py: { expr: "_k_utf8({self})" } }

# Num is the parent of every scalar, so these entries serve Int8..Int64,
# UInt8..UInt64, Size, Float32 and Float64; the receiver's own C++ type picks
# the instantiation. `abs` is kira::abs, a template that returns its argument
# type: std::abs is ambiguous for uint32_t, uint64_t and size_t, and returns
# int for the 8- and 16-bit types (a narrowing under brace-init).
Num.equals:    { cpp: { expr: "({self} == {0})", pure: true, constexpr: true } }
Num.hashCode:  { cpp: { expr: "kira::hashCode({self})", pure: true, constexpr: true } }
Num.abs:       { cpp: { expr: "kira::abs({self})", pure: true, constexpr: true } }
Num.toInt32:   { cpp: { expr: "kira::as<std::int32_t>({self})", pure: true, constexpr: true } }
Num.toInt64:   { cpp: { expr: "kira::as<std::int64_t>({self})", pure: true, constexpr: true } }
Num.toFloat32: { cpp: { expr: "kira::as<float>({self})", pure: true, constexpr: true } }
Num.toFloat64: { cpp: { expr: "kira::as<double>({self})", pure: true, constexpr: true } }

# FloatNum.fixed (D50) and IntNum.toHex (D51): kira::fixed and kira::hex in rt.hxx, through
# std::to_chars; they return a Str, so a freestanding module has neither. On py, %.*f and %x.
FloatNum.fixed: { cpp: { expr: "kira::fixed({self}, {0})", pure: true }, py: { expr: "_k_fixed({self}, {0})" } }
IntNum.toHex:   { cpp: { expr: "kira::hex({self})", pure: true }, py: { expr: "_k_hex({self})" } }

bitCast:       { cpp: { expr: "kira::bitCast<{T0}>({0})", pure: true, constexpr: true } }
enumOf:        { cpp: { expr: "kira::enumOf<{T0}>({0})", pure: true, constexpr: true } }

# kira::StrBuf<N> (core.hxx) is a literal type, so every entry is constexpr. An
# interpolation passed to StrBuf.set / StrBuf.add is typed View<Char> and never
# becomes a Str: the emitter lowers it to clear() (set only) and one add / addInt /
# addUInt / addFixed / addChar per piece (design section 10), not to these exprs.
StrBuf.size:     { cpp: { expr: "{self}.size()", pure: true, constexpr: true } }
StrBuf.isEmpty:  { cpp: { expr: "{self}.isEmpty()", pure: true, constexpr: true } }
StrBuf.view:     { cpp: { expr: "{self}.view()", pure: true, constexpr: true } }
StrBuf.clear:    { cpp: { expr: "{self}.clear()", constexpr: true } }
StrBuf.add:      { cpp: { expr: "{self}.add({0})", constexpr: true } }
StrBuf.addChar:  { cpp: { expr: "{self}.addChar({0})", constexpr: true } }
StrBuf.addInt:   { cpp: { expr: "{self}.addInt({0})", constexpr: true } }
StrBuf.addUInt:  { cpp: { expr: "{self}.addUInt({0})", constexpr: true } }
StrBuf.addFixed: { cpp: { expr: "{self}.addFixed({0}, {1})", constexpr: true } }
StrBuf.set:      { cpp: { expr: "({self}.clear(), {self}.add({0}))", constexpr: true } }
